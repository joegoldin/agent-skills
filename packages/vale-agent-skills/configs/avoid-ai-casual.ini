# avoid-ai-writing -- `casual` context profile.
# Slack messages, internal notes, quick replies. P0 only: chat artifacts,
# sycophancy, reasoning scaffolding, model-limitation disclaimers, and the
# generation fingerprints. Everything below `error` is filtered out, and the
# Tier 1 word list is demoted so it falls below the threshold too.
MinAlertLevel = error

[*]
BasedOnStyles = AvoidAI
AvoidAI.Tier1 = warning
