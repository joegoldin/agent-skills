# avoid-ai-writing -- `linkedin` context profile.
# Short-form social: punchy fragments and visual formatting are the medium, so
# formatting and rhythm rules relax. The share-post tells get stricter.
MinAlertLevel = suggestion

[*]
BasedOnStyles = AvoidAI
AvoidAI.EmDash = suggestion
AvoidAI.BoldOveruse = NO
AvoidAI.Emoji = suggestion
AvoidAI.Copula = NO
AvoidAI.Transitions = NO
AvoidAI.ListInflation = suggestion
AvoidAI.Hooks = suggestion
AvoidAI.HeadingCase = NO
AvoidAI.FormulaicHeadings = NO
AvoidAI.ExcessiveStructure = NO
AvoidAI.ParagraphUniformity = NO
AvoidAI.MissingFirstPerson = NO
AvoidAI.SentenceUniformity = suggestion
AvoidAI.Hashtags = error
AvoidAI.SocialEndorsement = error
AvoidAI.GenericConclusion = error
AvoidAI.FutureNarrative = error
