# avoid-ai-writing -- `docs` context profile.
# Clarity over voice. Lists, bold, structure, hedged accuracy, neutrality, and
# a compressed vocabulary are all correct in documentation, so those rules
# stand down.
MinAlertLevel = suggestion

[*]
BasedOnStyles = AvoidAI
AvoidAI.EmDash = suggestion
AvoidAI.EmDashBudget = suggestion
AvoidAI.BoldOveruse = NO
AvoidAI.Emoji = NO
AvoidAI.CurlyQuotes = NO
AvoidAI.HedgeStack = suggestion
AvoidAI.TechnicalExceptions = NO
AvoidAI.SignificanceInflation = suggestion
AvoidAI.RealActualInflation = suggestion
AvoidAI.Promotional = suggestion
AvoidAI.Copula = NO
AvoidAI.Transitions = suggestion
AvoidAI.GenericConclusion = NO
AvoidAI.FutureNarrative = NO
AvoidAI.SocialEndorsement = NO
AvoidAI.Hashtags = NO
AvoidAI.ListInflation = NO
AvoidAI.Tier3 = NO
AvoidAI.Boilerplate = suggestion
AvoidAI.VocabularyDiversity = NO
AvoidAI.MissingFirstPerson = NO
AvoidAI.ExcessiveStructure = NO
AvoidAI.BulletNounPhrases = NO
AvoidAI.ParagraphUniformity = NO
AvoidAI.SmartPunctSignature = NO
