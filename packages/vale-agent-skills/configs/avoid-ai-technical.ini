# avoid-ai-writing -- `technical-blog` context profile.
# Long-form with code, architecture, and APIs. The words with a real technical
# sense (robust, comprehensive, seamless, leverage, ecosystem, facilitate,
# underpin, streamline) stop being flagged; the unambiguous AI-isms do not.
MinAlertLevel = suggestion

[*]
BasedOnStyles = AvoidAI
AvoidAI.TechnicalExceptions = NO
AvoidAI.HedgeStack = suggestion
AvoidAI.Copula = suggestion
AvoidAI.ListInflation = suggestion
AvoidAI.Hashtags = NO
AvoidAI.HeadingCase = NO
AvoidAI.Tier3 = NO
