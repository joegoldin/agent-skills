# simple-english -- strict mode.
# Everything the pragmatic profile checks, escalated, plus vocabulary
# discipline. Full ASD-STE100 compliance still needs the official dictionary
# (a free download at asd-ste100.org); no tool can certify it.
MinAlertLevel = suggestion

[*]
BasedOnStyles = SimpleEnglish
SimpleEnglish.ProceduralLength = warning
SimpleEnglish.TrailingCondition = warning
SimpleEnglish.Passive = warning
SimpleEnglish.PhrasalVerbs = warning
SimpleEnglish.ParagraphLength = warning
SimpleEnglish.Terse = warning
Vale.Repetition = YES
