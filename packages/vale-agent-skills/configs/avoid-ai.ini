# avoid-ai-writing -- the full rule set, at full strength.
#
# One config, matching how the skill is structured: the linter reports every
# machine-detectable hit, and the context profiles and tolerance matrix in
# SKILL.md are the writer's judgment about which hits to act on. The single
# exception is `--context technical`, which the launcher turns into a Vale
# filter (see vale-skill.sh).
MinAlertLevel = suggestion

[*]
BasedOnStyles = AvoidAI
Vale.Repetition = YES
