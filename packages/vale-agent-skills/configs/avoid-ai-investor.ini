# avoid-ai-writing -- `investor-email` context profile.
# High-trust audience: promotional language is the biggest risk, so the
# inflation, closer, and hedging rules escalate to errors.
MinAlertLevel = suggestion

[*]
BasedOnStyles = AvoidAI
AvoidAI.SignificanceInflation = error
AvoidAI.RealActualInflation = error
AvoidAI.Promotional = error
AvoidAI.GenericConclusion = error
AvoidAI.FutureNarrative = error
AvoidAI.SocialEndorsement = error
AvoidAI.HedgeStack = error
AvoidAI.Hashtags = error
AvoidAI.Attribution = error
AvoidAI.Boilerplate = warning
AvoidAI.BoilerplateCluster = error
AvoidAI.Transitions = warning
AvoidAI.Tier3 = warning
