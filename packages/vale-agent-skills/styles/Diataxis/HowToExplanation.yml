extends: existence
message: "Explanation inside a how-to ('%s') -- link to the explanation and keep the steps moving."
level: suggestion
ignorecase: true
tokens:
  - 'the\s+reason\s+(?:for\s+this\s+|why\s+)?is'
  - 'this\s+is\s+because'
  - 'under\s+the\s+hood'
  - 'to\s+understand\s+(?:why|how)\s+this\s+works'
  - 'historically,'
  - 'the\s+design\s+(?:rationale|philosophy)'
  - 'it.s\s+important\s+to\s+understand'
