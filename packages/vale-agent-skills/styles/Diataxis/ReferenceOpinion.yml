# Reference is austere and neutral. Opinion, apology, and salesmanship all read
# as noise to someone consulting it mid-task.
extends: existence
message: "Opinion inside reference ('%s') -- keep reference neutral and factual."
level: suggestion
ignorecase: true
tokens:
  - 'the\s+best\s+(?:way|option|choice|approach)'
  - '(?:is|are)\s+recommended'
  - 'you\s+probably'
  - 'unfortunately'
  - 'simply'
  - 'obviously'
  - 'of\s+course'
  - 'note\s+that\s+you'
  - 'powerful'
  - 'easy\s+to\s+use'
