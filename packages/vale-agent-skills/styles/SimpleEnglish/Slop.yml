# Not from the standard. Maps the words AI-generated docs overuse to plain
# replacements, in the spirit of the STE dictionary's banned-word list.
extends: substitution
message: "'%[2]s' -- write %[1]s."
level: warning
ignorecase: true
swap:
  'leverag(?:e|es|ed|ing)': '"use"'
  'utiliz(?:e|es|ed|ing)': '"use"'
  'in order to': '"to"'
  'prior to': '"before"'
  'ensur(?:e|es|ed|ing)': '"make sure that"'
  'it is worth noting that': 'nothing -- delete it'
  'it.s important to': 'nothing -- state the fact'
  'crucially': 'nothing -- state the fact'
  'simply': 'nothing -- delete it'
  'easily': 'nothing -- delete it'
  'seamlessly': 'nothing -- delete it'
  'effortlessly': 'nothing -- delete it'
  'robust': 'the measurable property'
  'powerful': 'the measurable property'
  'comprehensive': 'the measurable property'
  'performant': 'the measured latency or throughput'
  'functionality': '"function" or "feature"'
  '(?:enables|allows) you to': '"you can"'
  'is designed to': 'what it does'
  'aims to': 'what it does'
  'facilitat(?:e|es|ed|ing)': '"help" or "make possible"'
  'div(?:e|es|ing) into': '"read" or "examine"'
  'delv(?:e|es|ing) into': '"read" or "examine"'
  'when it comes to': '"for"'
  'in the event that': '"if"'
  'due to the fact that': '"because"'
  'as (?:needed|necessary)': 'the condition'
  'and/or': '"X, or Y, or both"'
  'gracefully handles': 'what it does'
  'out of the box': '"by default"'
  'under the hood': '"internally"'
  'blazingly fast': 'the number'
  'state[- ]of[- ]the[- ]art': 'nothing -- delete it'
  'streamlin(?:e|es|ed|ing)': '"make simpler" or "make faster"'
  'plethora|myriad': '"many"'
  'addresses the issue': '"corrects the fault"'
  'tackl(?:e|es|ed|ing)': '"corrects" or "removes"'
