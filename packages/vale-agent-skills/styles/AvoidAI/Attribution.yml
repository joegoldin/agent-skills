# Attribution with nobody attached, prestige name-dropping, and guesses
# formatted as background.
extends: existence
message: "Unsourced claim ('%s') -- name the source or state the fact directly."
level: warning
ignorecase: true
tokens:
  - 'experts (?:believe|say|agree|suggest)'
  - 'studies (?:show|suggest|have shown)'
  - 'research (?:shows|suggests|indicates)'
  - 'industry leaders agree'
  - 'it is widely believed'
  - 'many believe'
  - 'is believed to have'
  - 'appears to have (?:studied|worked|begun)'
  - 'is thought to have'
  - 'likely began (?:his|her|their) career'
  - 'maintains a (?:relatively )?low (?:public )?profile'
