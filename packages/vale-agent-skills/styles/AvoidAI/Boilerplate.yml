# Tier 3 phrases: multi-word boilerplate that stacks in AI-generated content.
# Flag the individual hit quietly; three or more distinct phrases in one piece
# is the real signal (a judgment call the skill makes, not Vale).
extends: existence
message: "Boilerplate phrase ('%s') -- name the specific thing instead."
level: suggestion
ignorecase: true
tokens:
  - 'emerging\s+(?:sector|space|category|landscape)'
  - 'the\s+integration\s+of'
  - 'the\s+intersection\s+of'
  - 'community[- ]driven'
  - 'long[- ]term\s+sustainability'
  - 'user\s+engagement'
  - 'decentralized\s+compute'
  - 'reward\s+emissions'
  - 'tokenized\s+incentive\s+structures'
  - 'designed\s+for\s+long[- ]term'
  - 'rapidly\s+evolving'
  - 'in\s+today.s\s+(?:fast[- ]paced\s+|digital\s+|modern\s+)?\w+'
