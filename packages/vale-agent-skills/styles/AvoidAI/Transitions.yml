extends: substitution
message: "Reflexive transition: use '%s' instead of '%s'."
level: warning
ignorecase: true
action:
  name: replace
swap:
  'moreover': 'and, also, on top of that (or restructure)'
  'furthermore': 'and, also (or restructure)'
  'additionally': 'and, also (or restructure)'
  'in\s+an\s+era\s+where': 'state the specific context'
  'in\s+conclusion': 'cut -- the conclusion should be obvious'
  'in\s+summary': 'cut -- the summary should be obvious'
  'to\s+summari[sz]e': 'cut -- the summary should be obvious'
  'when\s+it\s+comes\s+to': 'talk about the thing directly'
  'at\s+the\s+end\s+of\s+the\s+day': 'cut'
  'that\s+(?:said|being\s+said)': 'but, yet, however (or cut)'
