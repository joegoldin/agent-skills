# Telling the reader how to feel about a fact instead of letting the fact land.
# One in a long piece is fine; see CalibrationDensity for the stacking rule.
extends: existence
message: "Confidence-calibration cue ('%s') -- let the fact speak for itself."
level: suggestion
ignorecase: true
tokens:
  - 'interestingly'
  - 'surprisingly'
  - 'importantly'
  - 'notably'
  - 'undoubtedly'
  - 'without\s+a\s+doubt'
  - 'make\s+no\s+mistake'
  - 'the\s+real\s+question\s+is'
  - 'at\s+its\s+core'
  - 'fundamentally'
  - 'the\s+truth\s+is'
