# Claiming an emotion or labelling your own point as the clever one, instead of
# writing so the reader gets there unaided.
extends: existence
message: "Tell-don't-show ('%s') -- make the writing earn it."
level: warning
ignorecase: true
tokens:
  - 'what surprised me most'
  - 'I was fascinated to (?:discover|learn)'
  - 'what struck me was'
  - 'I was excited to learn'
  - 'the most interesting part'
  - 'interesting (?:part|thing|aspect)(?: of| here| about)?'
  - 'here.s where it gets (?:clever|interesting|good)'
  - '(?:that|this|the last|the third|the second|the fourth) (?:one|move|bullet|point|part|bit|item) is the (?:contrarian|clever|surprising|counterintuitive|interesting|key|important|unusual|smart|brilliant|real|actual)'
