# Boilerplate lands two ways. Per-phrase: the same phrase twice is already
# suspect. Cross-phrase: three or more DISTINCT boilerplate phrases in one
# piece, each used once, is the shape an LLM takes when it varies its own
# boilerplate to seem less repetitive -- the per-phrase rule misses it.
#
# Ported from the avoid-ai-detect `tier3-phrase` / `tier3-phrase-cluster` pair.
extends: script
message: "Boilerplate"
level: warning
scope: summary
script: |
  text := import("text")
  fmt := import("fmt")

  PHRASES := [
    "emerging (?:sector|space|category|landscape)",
    "the integration of",
    "the intersection of",
    "community[- ]driven",
    "long[- ]term sustainability",
    "user engagement",
    "decentralized compute",
    "reward emissions",
    "tokenized incentive structures",
    "designed for long[- ]term",
    "rapidly evolving",
    "best[- ]in[- ]class",
    "cutting[- ]edge (?:technology|solution|platform)",
    "seamless (?:integration|experience)",
    "robust (?:framework|ecosystem|infrastructure)"
  ]
  matches := []
  distinct := 0
  repeated := []
  for p in PHRASES {
    hits := text.re_find("(?i)" + p, scope, -1)
    if is_undefined(hits) { continue }
    distinct += 1
    if len(hits) >= 2 { repeated = append(repeated, hits[0][0].text) }
  }
  if distinct >= 3 {
    matches = append(matches, {begin: 0, end: 1, message: fmt.sprintf(
      "%d distinct boilerplate phrases stacked in one piece -- name the specific things instead.",
      distinct)})
  }
  if len(repeated) > 0 {
    matches = append(matches, {begin: 2, end: 3, message: fmt.sprintf(
      "Boilerplate phrase repeated: '%v' -- once is filler, twice is a pattern.",
      repeated[0])})
  }
