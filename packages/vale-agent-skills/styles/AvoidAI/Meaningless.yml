# Participial pseudo-analysis, the "despite challenges ... continues to thrive"
# non-statement, and false-concession balance.
extends: existence
message: "Says nothing ('%s') -- replace with a specific fact or cut."
level: warning
ignorecase: true
tokens:
  - ',\s*(?:symboli[sz]ing|reflecting|showcasing|highlighting|underscoring|emphasi[sz]ing|signaling|cementing|solidifying)'
  - 'this represents a broader shift'
  - 'speaks to a larger trend'
  - 'symboli[sz]es a commitment to'
  - 'despite (?:the )?challenges'
  - 'while facing headwinds'
  - 'remains? resilient'
  - 'continues to thrive'
