# AI rotates synonyms to avoid repeating a word: "developers... engineers...
# practitioners... builders" inside one paragraph. Human writers repeat the
# clearest word and vary only when it reads better.
#
# Fires when three or more members of one concept group appear in a single
# paragraph. Two is normal writing; three is thesaurus abuse.
extends: script
message: "Synonyms"
level: warning
scope: paragraph
script: |
  text := import("text")
  fmt := import("fmt")

  GROUPS := [
    ["developer", "engineer", "practitioner", "builder", "coder", "programmer"],
    ["user", "customer", "client", "consumer", "end-user"],
    ["company", "organization", "organisation", "business", "firm", "enterprise"],
    ["tool", "solution", "platform", "system", "framework"],
    ["problem", "issue", "challenge", "obstacle", "hurdle"],
    ["improve", "enhance", "boost", "elevate", "optimize", "optimise"],
    ["create", "build", "craft", "construct", "develop"],
    ["show", "demonstrate", "illustrate", "highlight", "showcase"],
    ["important", "crucial", "vital", "essential", "critical"],
    ["fast", "quick", "rapid", "swift", "speedy"]
  ]
  matches := []
  lower := text.to_lower(scope)
  for g in GROUPS {
    found := []
    for w in g {
      if !is_undefined(text.re_find("\\b" + w + "s?\\b", lower, 1)) {
        found = append(found, w)
      }
    }
    if len(found) >= 3 {
      list := ""
      for f in found { list = list == "" ? f : list + ", " + f }
      matches = append(matches, {begin: 0, end: 1, message: fmt.sprintf(
        "Synonym cycling in one paragraph (%v) -- pick the clearest word and repeat it.", list)})
    }
  }
