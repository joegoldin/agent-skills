# Fragment-hooks that fake momentum, reader-steering frames, and rhetorical
# questions used as section transitions.
extends: existence
message: "Engagement hook ('%s') -- delete the hook and state the thing."
level: warning
nonword: true
raw:
  - '(?i)(?:\bthe catch\?|\bthe kicker\?|\bhere.s the kicker|\bhere.s the thing[.:]|\bthe best part\?|\bplot twist:|\bthe result\?|\bhere.s what.s interesting|\bhere.s the interesting part|\bhere.s what (?:caught my eye|stood out)|\bso why should you care\?|\bbut what does this mean\b[^?]{0,40}\?|\bwhat.s next\?|\bwhy does this matter\?)'
